// ---------- Abgleich zwischen Handy und Laptop ----------
// Jedes Gerät merkt sich den zuletzt geladenen/gespeicherten Stand ("Basis"). Hat inzwischen ein anderes
// Gerät gespeichert, werden beim Speichern beide Änderungen zusammengeführt statt überschrieben.
const GERAET = (() => {
  let id = "";
  try {
    id = localStorage.getItem("geraet_id") || "";
    if (!id) {
      id = Math.random().toString(36).slice(2, 7);
      localStorage.setItem("geraet_id", id);
    }
  } catch (e) {}
  const art = /Android|iPhone|iPad|Mobile/i.test(navigator.userAgent) ? "Handy" : "PC";
  return { id, art };
})();
const neuerStand = () => ({ zeit: new Date().toISOString(), geraet: GERAET.id, art: GERAET.art });
const ohneStand = (rec) => {
  if (!rec || typeof rec !== "object") return rec;
  const { _stand, ...rest } = rec;
  return rest;
};
const gleichJson = (a, b) => JSON.stringify(a) === JSON.stringify(b);
const hatIds = (arr) => Array.isArray(arr) && arr.every((x) => x && typeof x === "object" && x.id != null);

// Drei-Wege-Abgleich: basis = gemeinsamer Ausgangsstand, mein = dieses Gerät, dein = Speicher (anderes Gerät)
function abgleichen(basis, mein, dein, schluessel) {
  if (gleichJson(mein, basis)) return dein;
  if (dein === undefined || gleichJson(dein, basis) || gleichJson(mein, dein)) return mein;
  // Lagerbestand: Änderungen beider Geräte zusammenrechnen (z.B. zwei Abbuchungen)
  if (schluessel === "stock" && [basis, mein, dein].every((v) => typeof v === "number")) {
    return Math.round((dein + (mein - basis)) * 1000) / 1000;
  }
  // Listen mit IDs (Rohstoffe, Rezepte, Kunden, Backtage, Bestellungen …): Eintrag für Eintrag
  if (hatIds(mein) && hatIds(dein)) {
    const b = new Map((hatIds(basis) ? basis : []).map((x) => [x.id, x]));
    const m = new Map(mein.map((x) => [x.id, x]));
    const d = new Map(dein.map((x) => [x.id, x]));
    const ergebnis = [];
    dein.forEach((t) => {
      const bb = b.get(t.id);
      const mm = m.get(t.id);
      if (!mm) {
        if (bb && gleichJson(t, bb)) return; // hier gelöscht, dort unverändert -> weg
        ergebnis.push(t); // dort neu oder dort geändert -> behalten
        return;
      }
      ergebnis.push(bb ? abgleichen(bb, mm, t) : mm);
    });
    mein.forEach((mm) => {
      if (d.has(mm.id)) return;
      const bb = b.get(mm.id);
      if (bb && gleichJson(mm, bb)) return; // dort gelöscht, hier unverändert -> weg
      ergebnis.push(mm); // hier neu oder hier geändert -> behalten
    });
    return ergebnis;
  }
  // Objekte: Feld für Feld
  const istObj = (v) => v && typeof v === "object" && !Array.isArray(v);
  if (istObj(mein) && istObj(dein)) {
    const bo = istObj(basis) ? basis : {};
    const out = {};
    new Set([...Object.keys(dein), ...Object.keys(mein)]).forEach((k) => {
      if (!(k in mein) && k in bo) {
        if (!gleichJson(dein[k], bo[k])) out[k] = dein[k]; // hier gelöscht, dort geändert -> behalten
        return;
      }
      if (!(k in dein) && k in bo) {
        if (!gleichJson(mein[k], bo[k])) out[k] = mein[k];
        return;
      }
      const v = abgleichen(bo[k], mein[k], dein[k], k);
      if (v !== undefined) out[k] = v;
    });
    return out;
  }
  return mein; // beide Geräte haben denselben Wert geändert -> dieses Gerät gewinnt
}

// ---------- Protokoll: was hat der Chef geändert? (kurze Sätze, Expedit-Häkchen ausgenommen) ----------
function bestellAenderungen(alt, neu) {
  if (!alt || !neu) return [];
  const zeilen = [];
  const kName = (id) => (neu.kunden || []).find((k) => k.id === id)?.name || (alt.kunden || []).find((k) => k.id === id)?.name || "unbekannt";
  const vergleich = (b) => { const { expedit, bezahlt, ...rest } = b || {}; return JSON.stringify(rest); };
  const nachId = (liste) => new Map((liste || []).map((x) => [x.id, x]));

  const altK = nachId(alt.kunden), neuK = nachId(neu.kunden);
  neuK.forEach((k, id) => {
    if (!altK.has(id)) zeilen.push(`Kunde angelegt: ${k.name}`);
    else if (altK.get(id).name !== k.name) zeilen.push(`Kunde umbenannt: ${altK.get(id).name} → ${k.name}`);
  });
  altK.forEach((k, id) => { if (!neuK.has(id)) zeilen.push(`Kunde gelöscht: ${k.name}`); });

  const altB = nachId(alt.backtage), neuB = nachId(neu.backtage);
  neuB.forEach((bt, id) => {
    const d = fmtDatum(bt.datum);
    const ab = altB.get(id);
    if (!ab) zeilen.push(`Backtag angelegt: ${d}`);
    const aBest = nachId(ab && ab.bestellungen);
    (bt.bestellungen || []).forEach((b) => {
      const a = aBest.get(b.id);
      if (!a) zeilen.push(`Bestellung ${kName(b.kundeId)} (${d}) eingetragen: ${bestellText(b, neu.sorten)}`);
      else {
        if (vergleich(a) !== vergleich(b)) zeilen.push(`Bestellung ${kName(b.kundeId)} (${d}) geändert: ${bestellText(b, neu.sorten)}`);
        if (!!a.bezahlt !== !!b.bezahlt) zeilen.push(`${kName(b.kundeId)} (${d}): ${b.bezahlt ? "bezahlt" : "wieder nicht bezahlt"}`);
      }
    });
    aBest.forEach((a, bid) => { if (!(bt.bestellungen || []).some((b) => b.id === bid)) zeilen.push(`Bestellung ${kName(a.kundeId)} (${d}) gelöscht`); });
    if (ab && bt.lagerUebergeben && ab.lagerUebergeben !== bt.lagerUebergeben) zeilen.push(`Backzettel ${d} an die Lager-App übergeben`);
  });
  altB.forEach((bt, id) => { if (!neuB.has(id)) zeilen.push(`Backtag gelöscht: ${fmtDatum(bt.datum)}`); });

  const altS = nachId(alt.sorten), neuS = nachId(neu.sorten);
  neuS.forEach((s, id) => {
    if (!altS.has(id)) zeilen.push(`Sorte angelegt: ${s.kurz}`);
    else if (JSON.stringify(altS.get(id)) !== JSON.stringify(s)) zeilen.push(`Sorte geändert: ${s.kurz}`);
  });
  altS.forEach((s, id) => { if (!neuS.has(id)) zeilen.push(`Sorte gelöscht: ${s.kurz}`); });
  if (JSON.stringify(alt.herstellProzent) !== JSON.stringify(neu.herstellProzent)) zeilen.push(`Herstellungskosten: ${neu.herstellProzent} % der Materialkosten`);
  return zeilen;
}
// Gleiche Sätze innerhalb von 3 Minuten nur einmal (z. B. beim Tippen in einem Namensfeld)
const zuletztProtokolliert = new Map();
function protokollieren(zeilen) {
  const jetzt = Date.now();
  const neu = zeilen.filter((z) => !(jetzt - (zuletztProtokolliert.get(z) || 0) < 180000));
  neu.slice(0, 8).forEach((z) => { zuletztProtokolliert.set(z, jetzt); Zugang.log(z); });
  if (neu.length > 8) Zugang.log(`… und ${neu.length - 8} weitere Änderungen`);
}

const fmtStand = (st) => {
  if (!st || !st.zeit) return "";
  const d = new Date(st.zeit);
  const heute = new Date().toDateString() === d.toDateString();
  const zeit = d.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
  const wer = st.geraet === GERAET.id ? "diesem Gerät" : st.art === "Handy" ? "dem Handy" : st.art === "PC" ? "dem Laptop/PC" : "einem anderen Gerät";
  return `${heute ? "heute" : d.toLocaleDateString("de-DE")} ${zeit} von ${wer}`;
};

// ---------- Expedit: alle Produkte des Backtags, pro Produkt die Kunden von der größten zur kleinsten Menge ----------
// Jedes Produkt muss bei jedem Kunden bestätigt werden. Gespeichert wird in der Bestellung: expedit[sorteId] = bestätigte
// Menge – ändert sich die Menge danach, ist es wieder offen ("Menge geändert – nochmal bestätigen").
function ExpeditTab({ backtag, sorten, kunden, updateBacktag }) {
  const [offen, setOffen] = useState({});
  const kName = (id) => kunden.find((k) => k.id === id)?.name || "(unbekannt)";
  const produkte = useMemo(() => {
    const bestellungen = backtag.bestellungen || [];
    return sorten
      .map((s) => {
        const proKunde = new Map();
        bestellungen.forEach((b) => {
          const q = Number(b.items?.[s.id]) || 0;
          if (q <= 0) return;
          const k = proKunde.get(b.kundeId) || { kundeId: b.kundeId, name: kName(b.kundeId), menge: 0, fertig: true, vorher: false };
          const bestaetigt = b.expedit?.[s.id];
          k.menge += q;
          if (Number(bestaetigt) !== q) {
            k.fertig = false;
            if (bestaetigt != null) k.vorher = true; // war bestätigt, Menge hat sich seither geändert
          }
          proKunde.set(b.kundeId, k);
        });
        const kundenListe = [...proKunde.values()].sort((a, b) => b.menge - a.menge || a.name.localeCompare(b.name, "de"));
        return {
          sorte: s,
          gesamt: kundenListe.reduce((x, k) => x + k.menge, 0),
          kunden: kundenListe,
          fertig: kundenListe.filter((k) => k.fertig).length,
        };
      })
      .filter((p) => p.gesamt > 0);
  }, [backtag, sorten, kunden]);

  // Bestätigen bzw. wieder auf offen setzen – gilt für alle Bestellungen dieses Kunden mit dieser Sorte
  const setzen = (kundeId, sorteId, fertig) => {
    const s = sorten.find((x) => x.id === sorteId);
    const menge = (backtag.bestellungen || []).filter((b) => b.kundeId === kundeId).reduce((n, b) => n + (Number(b.items?.[sorteId]) || 0), 0);
    Zugang.log(`Expedit ${fmtDatum(backtag.datum)}: ${kName(kundeId)} – ${fmtQty(menge)}× ${s ? s.kurz : "?"} ${fertig ? "eingepackt ✓" : "wieder offen"}`);
    return updateBacktag((bt) => ({
      ...bt,
      bestellungen: bt.bestellungen.map((b) => {
        const q = Number(b.items?.[sorteId]) || 0;
        if (b.kundeId !== kundeId || q <= 0) return b;
        const expedit = { ...(b.expedit || {}) };
        if (fertig) expedit[sorteId] = q;
        else delete expedit[sorteId];
        return { ...b, expedit };
      }),
    }));
  };

  if (produkte.length === 0) {
    return <Card><p className="text-sm text-center py-8" style={{ color: COL.inkMuted }}>📦 Hier erscheinen alle Produkte, sobald Bestellungen eingetragen sind.</p></Card>;
  }
  const alleOffen = produkte.every((p) => offen[p.sorte.id]);
  const alleUmschalten = () => setOffen(alleOffen ? {} : Object.fromEntries(produkte.map((p) => [p.sorte.id, true])));
  const posten = produkte.reduce((s, p) => s + p.kunden.length, 0);
  const erledigt = produkte.reduce((s, p) => s + p.fertig, 0);
  const allesFertig = erledigt === posten;
  // Was fehlt noch bei wem? (zum Schluss kontrollieren)
  const fehlt = new Map();
  produkte.forEach((p) =>
    p.kunden.filter((k) => !k.fertig).forEach((k) => {
      const f = fehlt.get(k.kundeId) || { name: k.name, teile: [] };
      f.teile.push(`${fmtQty(k.menge)}× ${p.sorte.kurz}`);
      fehlt.set(k.kundeId, f);
    })
  );
  const fehltListe = [...fehlt.values()].sort((a, b) => a.name.localeCompare(b.name, "de"));

  return (
    <div className="flex flex-col gap-4">
      <Card>
        <H2 right={<button onClick={alleUmschalten} className="text-sm shrink-0" style={{ color: COL.accent }}>{alleOffen ? "Alle zu" : "Alle auf"}</button>}>
          📦 Expedit · {fmtDatum(backtag.datum)}
        </H2>
        <div className="mb-3">
          <div className="flex justify-between text-sm mb-1">
            <span style={{ color: allesFertig ? COL.ok : COL.ink, fontWeight: 600 }}>{allesFertig ? "✅ Alles eingepackt" : `${erledigt} von ${posten} erledigt`}</span>
            <span style={{ color: COL.inkMuted }}>{Math.round((erledigt / posten) * 100)} %</span>
          </div>
          <div className="h-2 rounded-full overflow-hidden" style={{ backgroundColor: COL.line }}>
            <div className="h-full rounded-full" style={{ width: `${(erledigt / posten) * 100}%`, backgroundColor: allesFertig ? COL.ok : COL.accent, transition: "width .2s" }} />
          </div>
        </div>
        <p className="text-xs mb-3" style={{ color: COL.inkMuted }}>Tippe auf ein Produkt – die Kunden stehen von der größten zur kleinsten Menge. Hast du es für einen Kunden fertig, mit ✓ bestätigen.</p>
        <div className="flex flex-col gap-2">
          {produkte.map(({ sorte, gesamt, kunden: liste, fertig }) => {
            const auf = !!offen[sorte.id];
            const komplett = fertig === liste.length;
            return (
              <div key={sorte.id} className="rounded-xl overflow-hidden" style={{ border: `1px solid ${komplett ? COL.ok : auf ? COL.accent : COL.line}` }}>
                <button
                  onClick={() => setOffen((o) => ({ ...o, [sorte.id]: !o[sorte.id] }))}
                  className="w-full flex items-center justify-between gap-2 px-3 py-2.5 text-left"
                  style={{ backgroundColor: komplett ? COL.okSoft : auf ? COL.accentSoft : COL.surface }}
                  aria-expanded={auf}
                >
                  <span className="min-w-0">
                    <span className="font-semibold">{komplett ? "✅ " : ""}{sorte.kurz}</span>{" "}
                    <span className="text-xs" style={{ color: COL.inkMuted }}>{sorte.name !== sorte.kurz ? sorte.name : ""}</span>
                    <span className="block text-xs" style={{ color: komplett ? COL.ok : COL.inkMuted }}>
                      {komplett ? `fertig · ${liste.length} ${liste.length === 1 ? "Kunde" : "Kunden"}` : `${fertig} von ${liste.length} ${liste.length === 1 ? "Kunde" : "Kunden"} fertig`}
                    </span>
                  </span>
                  <span className="flex items-center gap-2 shrink-0">
                    <span className="text-xl font-bold" style={{ fontFamily: "'IBM Plex Mono', monospace" }}>{fmtQty(gesamt)}</span>
                    <span style={{ color: COL.inkMuted, transform: auf ? "rotate(180deg)" : "none", transition: "transform .15s" }}>▾</span>
                  </span>
                </button>
                {auf && (
                  <div>
                    {liste.map((k, i) => (
                      <button
                        key={k.kundeId}
                        onClick={() => setzen(k.kundeId, sorte.id, !k.fertig)}
                        className="w-full flex items-center gap-3 px-3 py-2 text-left"
                        style={{ backgroundColor: k.fertig ? COL.okSoft : i % 2 ? COL.bg : COL.surface, borderTop: `1px solid ${COL.line}` }}
                        aria-pressed={k.fertig}
                        aria-label={`${k.name}: ${fmtQty(k.menge)} ${sorte.kurz} ${k.fertig ? "fertig – antippen für offen" : "bestätigen"}`}
                      >
                        <span
                          className="flex items-center justify-center rounded-lg shrink-0 text-lg font-bold"
                          style={{ width: 34, height: 34, border: `2px solid ${k.fertig ? COL.ok : COL.line}`, backgroundColor: k.fertig ? COL.ok : "#fff", color: "#fff" }}
                        >
                          {k.fertig ? "✓" : ""}
                        </span>
                        <span className="flex-1 min-w-0">
                          <span className="block truncate" style={{ color: k.fertig ? COL.inkMuted : COL.ink, textDecoration: k.fertig ? "line-through" : "none" }}>{k.name}</span>
                          {k.vorher && <span className="block text-xs" style={{ color: COL.amber }}>Menge geändert – nochmal bestätigen</span>}
                        </span>
                        <span className="text-lg font-bold shrink-0" style={{ fontFamily: "'IBM Plex Mono', monospace", color: k.fertig ? COL.inkMuted : COL.ink }}>{fmtQty(k.menge)}</span>
                      </button>
                    ))}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      </Card>

      {!allesFertig && erledigt > 0 && (
        <Card>
          <H2>⏳ Noch nicht fertig</H2>
          <div className="flex flex-col gap-1.5 text-sm">
            {fehltListe.map((f) => (
              <div key={f.name} className="flex justify-between gap-3">
                <span className="font-medium truncate">{f.name}</span>
                <span className="text-right" style={{ color: COL.inkMuted }}>{f.teile.join(", ")}</span>
              </div>
            ))}
          </div>
        </Card>
      )}
    </div>
  );
}

// ---------- Haupt-App ----------
const TABS = [
  // mobil = kürzere Beschriftung für die untere Leiste am Handy (5 Reiter nebeneinander)
  { key: "bestellungen", label: "Bestellungen", mobil: "Bestellung", icon: IcList },
  { key: "backzettel", label: "Backzettel", icon: IcBread },
  { key: "expedit", label: "Expedit", icon: IcBox },
  { key: "kassa", label: "Kunden & €", mobil: "Kunden", icon: IcUsers },
  { key: "einstellungen", label: "Einstellungen", mobil: "Einstell.", icon: IcGear },
];

function App() {
  // Chef sieht alles; Mitarbeiter nur Bestellungen (ansehen), Backzettel und Expedit (abhaken)
  const chef = Zugang.istChef();
  const tabs = chef ? TABS : TABS.filter((t) => ["bestellungen", "backzettel", "expedit"].includes(t.key));
  const [config, setConfig] = useState(() => getConfig());
  const [daten, setDaten] = useState(leereDaten);
  const [lager, setLager] = useState(null);
  const [loading, setLoading] = useState(true);
  const [tab, setTab] = useState("bestellungen");
  const [backtagId, setBacktagId] = useState(null);
  const [sync, setSync] = useState("idle");
  const [syncFehler, setSyncFehler] = useState("");
  const [neuDatum, setNeuDatum] = useState(null); // offenes Datumsfeld für neuen Backtag
  const [druck, setDruck] = useState(null); // "backzettel" | "kundenzettel" | "lieferliste"
  const loadedRef = useRef(false);
  const dirtyRef = useRef(false);
  const skipSaveRef = useRef(false);
  // Abgleich: zuletzt geladener/gespeicherter Stand im Speicher und wann
  const basisRef = useRef(null);
  const basisZeitRef = useRef(0);
  const saveChainRef = useRef(Promise.resolve());
  const latestRef = useRef({});
  latestRef.current = { daten, config };
  const [letzterStand, setLetzterStand] = useState(null);
  const [abgleichInfo, setAbgleichInfo] = useState(null);
  const [ladeFehler, setLadeFehler] = useState("");
  const [ladeVersuch, setLadeVersuch] = useState(0);
  const [zweitSpeicher, setZweitSpeicher] = useState(null); // weitere Bestell-Speicher (z.B. vom anderen Gerät)
  const [speicherInfo, setSpeicherInfo] = useState("");

  const ladeLager = async (c = latestRef.current.config) => {
    try {
      const rec = await binRead(c.apiKey, c.lagerBin);
      setLager({ recipes: rec.recipes || [], materials: rec.materials || [] });
    } catch (e) {
      setLager(null);
    }
  };
  // Liest den Bestell-Speicher; liefert den Rohstand (für den Abgleich) und die fertigen Daten (mit Sorten-Updates)
  const ladeDaten = async (c) => {
    const rec = await binRead(c.apiKey, c.bestellBin);
    if (rec.ersetztDurch) return { umziehen: rec.ersetztDurch };
    const d = { ...leereDaten(), ...rec, sortenUpdates: rec.sortenUpdates || [] };
    delete d._stand;
    const fertig = !rec.sorten?.length ? { ...d, sorten: STANDARD_SORTEN, sortenUpdates: SORTEN_UPDATES.map((u) => u.id) } : sortenAktualisieren(d);
    return { rec, daten: fertig };
  };
  const umziehen = (c, neuerBin) => {
    // Dieser Speicher wurde auf einem anderen Gerät mit dem richtigen zusammengeführt -> dorthin wechseln
    const neu = { ...c, bestellBin: neuerBin };
    saveConfig(neu);
    setSpeicherInfo("Dieses Gerät verwendet jetzt denselben Bestell-Speicher wie dein anderes Gerät.");
    setConfig(neu);
  };

  useEffect(() => {
    if (!config) { setLoading(false); return; }
    let cancelled = false;
    setLoading(true);
    setLadeFehler("");
    (async () => {
      try {
        const [res] = await Promise.all([ladeDaten(config), ladeLager(config)]);
        if (cancelled) return;
        if (res.umziehen) return umziehen(config, res.umziehen);
        basisRef.current = bestellNormalisieren(res.rec);
        basisZeitRef.current = Date.now();
        setLetzterStand(res.rec._stand || null);
        // Nur speichern, wenn beim Laden etwas angepasst wurde (Sorten-Update) – spart Zugriffe
        skipSaveRef.current = gleichJson(bestellNormalisieren(res.daten), basisRef.current);
        setDaten(res.daten);
        const d = res.daten;
        const kommend = [...d.backtage].sort((a, b) => a.datum.localeCompare(b.datum)).find((b) => b.datum >= isoHeute());
        setBacktagId((kommend || d.backtage[d.backtage.length - 1])?.id || null);
        // Team-Speicher (Mitarbeiter & Protokoll): steht im Bestell-Speicher, damit jedes Gerät ihn kennt
        if (d.teamBin) Zugang.teamBinSetzen(d.teamBin);
        else if (chef && Zugang.geraet().teamBin) setDaten((x) => ({ ...x, teamBin: Zugang.geraet().teamBin }));
        loadedRef.current = true;
        setLoading(false);
        if (chef) speicherPruefen(config);
      } catch (e) {
        // Nicht mit leeren Daten weiterarbeiten – sonst würden die echten Daten beim Speichern überschrieben
        if (cancelled) return;
        loadedRef.current = false;
        setLadeFehler(e.message || "Speicher nicht erreichbar");
        setLoading(false);
      }
    })();
    return () => { cancelled = true; };
  }, [config, ladeVersuch]);

  // Speichern mit Abgleich: vor JEDEM Speichern nachsehen, ob ein anderes Gerät inzwischen gespeichert hat –
  // dann beide Änderungen zusammenführen statt zu überschreiben (kostet einen Lesezugriff pro Speichern).
  const speichern = async (mein) => {
    const c = latestRef.current.config;
    let ziel = mein;
    const cloud = await binRead(c.apiKey, c.bestellBin);
    if (cloud.ersetztDurch) {
      umziehen(c, cloud.ersetztDurch);
      throw new Error("Speicher wurde zusammengeführt – deine letzte Änderung bitte nochmal eintragen");
    }
    const dein = bestellNormalisieren(cloud);
    if (!gleichJson(dein, basisRef.current)) {
      ziel = abgleichen(basisRef.current, mein, dein);
      setAbgleichInfo(cloud._stand || { zeit: new Date().toISOString() });
    }
    const stand = neuerStand();
    // Protokoll: was hat der Chef auf diesem Gerät geändert? (Expedit-Häkchen werden extra protokolliert)
    const aenderungen = Zugang.istChef() ? bestellAenderungen(basisRef.current, mein) : [];
    await binWrite(c.apiKey, c.bestellBin, { ...ziel, _stand: stand });
    protokollieren(aenderungen);
    basisRef.current = ziel;
    basisZeitRef.current = Date.now();
    setLetzterStand(stand);
    if (!gleichJson(ziel, mein)) {
      const jetzt = bestellNormalisieren(latestRef.current.daten);
      skipSaveRef.current = true;
      setDaten(gleichJson(jetzt, mein) ? ziel : abgleichen(mein, jetzt, ziel));
    }
    dirtyRef.current = !gleichJson(bestellNormalisieren(latestRef.current.daten), ziel);
  };
  const jetztSpeichern = () => {
    const mein = bestellNormalisieren(latestRef.current.daten);
    saveChainRef.current = saveChainRef.current
      .then(() => speichern(mein))
      .then(() => {
        setSync("saved");
        setSyncFehler("");
      })
      .catch((e) => {
        setSync("error");
        setSyncFehler(e.message);
      });
    return saveChainRef.current;
  };

  // Automatisch speichern
  useEffect(() => {
    if (!config || !loadedRef.current) return;
    if (skipSaveRef.current) {
      skipSaveRef.current = false;
      return;
    }
    dirtyRef.current = true;
    setSync("saving");
    const t = setTimeout(jetztSpeichern, 900);
    return () => clearTimeout(t);
  }, [daten]);

  // Neuesten Stand holen (beim Zurückkehren in die App oder per Knopf) – nur wenn hier nichts ungespeichert ist
  const holen = async () => {
    const c = latestRef.current.config;
    if (!c || dirtyRef.current || !loadedRef.current) return;
    try {
      const [res] = await Promise.all([ladeDaten(c), ladeLager(c)]);
      if (res.umziehen) return umziehen(c, res.umziehen);
      const dein = bestellNormalisieren(res.rec);
      setLetzterStand(res.rec._stand || null);
      if (!gleichJson(dein, basisRef.current) || !gleichJson(bestellNormalisieren(latestRef.current.daten), dein)) {
        skipSaveRef.current = gleichJson(bestellNormalisieren(res.daten), dein);
        setDaten(res.daten);
      }
      basisRef.current = dein;
      basisZeitRef.current = Date.now();
      setSync("saved");
    } catch (e) {}
  };

  useEffect(() => {
    let verstecktSeit = 0;
    const onVis = () => {
      if (document.visibilityState === "hidden") {
        verstecktSeit = Date.now();
        ausstehendSpeichern();
      } else if (verstecktSeit && Date.now() - verstecktSeit > 20 * 1000) {
        holen();
      }
    };
    // Nur wenn noch eine Änderung auf dem Weg ist: sofort abschicken
    const ausstehendSpeichern = () => {
      const { config: c, daten: d } = latestRef.current;
      if (!c || !loadedRef.current || !dirtyRef.current) return;
      try {
        fetch(`https://api.jsonbin.io/v3/b/${c.bestellBin}`, {
          method: "PUT",
          headers: { ...Zugang.kopf(true), ...(Zugang.istChef() ? {} : { "X-Bin-Versioning": "true" }) },
          body: JSON.stringify({ ...bestellNormalisieren(d), _stand: neuerStand() }),
          keepalive: true,
        });
      } catch (e) {}
    };
    document.addEventListener("visibilitychange", onVis);
    window.addEventListener("pagehide", ausstehendSpeichern);
    return () => {
      document.removeEventListener("visibilitychange", onVis);
      window.removeEventListener("pagehide", ausstehendSpeichern);
    };
  }, []);

  // Einmal am Tag nachsehen, ob es noch einen zweiten Bestell-Speicher gibt (z.B. am Handy extra eingerichtet)
  const speicherPruefen = async (c, zwingend = false) => {
    try {
      const heute = isoHeute() + c.bestellBin;
      if (!zwingend && localStorage.getItem("speicher_check") === heute) return;
      localStorage.setItem("speicher_check", heute);
      const andere = await andereBestellSpeicher(c);
      setZweitSpeicher(andere.length ? andere : null);
      if (zwingend && !andere.length) setSpeicherInfo("Alles in Ordnung – es gibt nur diesen einen Bestell-Speicher.");
    } catch (e) {}
  };
  const zusammenfuehren = async () => {
    const c = latestRef.current.config;
    let ergebnis = bestellNormalisieren(latestRef.current.daten);
    const summe = { kunden: 0, bestellungen: 0 };
    zweitSpeicher.forEach((z) => {
      const r = bestellSpeicherZusammenfuehren(ergebnis, z.rec);
      ergebnis = r.daten;
      summe.kunden += r.neueKunden;
      summe.bestellungen += r.neueBestellungen;
    });
    try {
      setSync("saving");
      const stand = neuerStand();
      await binWrite(c.apiKey, c.bestellBin, { ...ergebnis, _stand: stand });
      basisRef.current = ergebnis;
      basisZeitRef.current = Date.now();
      setLetzterStand(stand);
      skipSaveRef.current = true;
      setDaten(ergebnis);
      // Den anderen Speicher als "umgezogen" markieren – das andere Gerät stellt sich dann selbst um. Daten bleiben dort als Sicherung.
      for (const z of zweitSpeicher) {
        await binWrite(c.apiKey, z.id, { ...z.rec, ersetztDurch: c.bestellBin, ersetztAm: new Date().toISOString() });
      }
      setZweitSpeicher(null);
      setSync("saved");
      setSpeicherInfo(`Zusammengeführt: ${summe.kunden} Kunden und ${summe.bestellungen} Bestellungen übernommen. Dein anderes Gerät stellt sich beim nächsten Öffnen automatisch auf diesen Speicher um.`);
    } catch (e) {
      setSync("error");
      setSyncFehler(e.message);
    }
  };

  if (!config) return <NichtEingerichtet />;
  if (loading) {
    return (
      <div className="min-h-screen flex flex-col items-center justify-center gap-4" style={{ backgroundColor: COL.bg, fontFamily: "'IBM Plex Sans', sans-serif", color: COL.inkMuted }}>
        <div style={{ fontSize: 56, animation: "rise 1.6s ease-in-out infinite" }}>🧾</div>
        <Brand small />
        <div className="text-sm">Bestellungen werden geholt …</div>
      </div>
    );
  }
  if (ladeFehler) {
    return (
      <div className="min-h-screen flex flex-col items-center justify-center gap-4 px-6 text-center" style={{ backgroundColor: COL.bg, fontFamily: "'IBM Plex Sans', sans-serif", color: COL.ink }}>
        <Brand small />
        <div className="text-4xl">📡</div>
        <div className="font-semibold">Deine Bestellungen konnten nicht geladen werden.</div>
        <div className="text-sm max-w-sm" style={{ color: COL.inkMuted }}>
          Bitte Internetverbindung prüfen. Damit nichts überschrieben wird, arbeitet die App erst weiter, wenn deine Daten da sind.
          <br />
          <span className="text-xs">({ladeFehler})</span>
        </div>
        <Btn primary onClick={() => setLadeVersuch((v) => v + 1)}>Nochmal versuchen</Btn>
      </div>
    );
  }

  const backtage = [...daten.backtage].sort((a, b) => a.datum.localeCompare(b.datum));
  const backtag = daten.backtage.find((b) => b.id === backtagId) || null;

  const neuerBacktag = () => {
    const letzter = backtage[backtage.length - 1];
    const vorschlag = letzter && letzter.datum >= isoHeute() ? plusTage(letzter.datum, 7) : isoHeute();
    setNeuDatum(vorschlag);
  };
  const backtagAnlegen = (datum) => {
    setNeuDatum(null);
    if (!datum || !/^\d{4}-\d{2}-\d{2}$/.test(datum)) return;
    const vorhanden = daten.backtage.find((b) => b.datum === datum);
    if (vorhanden) { setBacktagId(vorhanden.id); return; }
    const bt = { id: uid(), datum, bestellungen: [], lagerUebergeben: null };
    setDaten((d) => ({ ...d, backtage: [...d.backtage, bt] }));
    setBacktagId(bt.id);
    setTab("bestellungen");
  };
  const updateBacktag = (fn) => setDaten((d) => ({ ...d, backtage: d.backtage.map((b) => (b.id === backtagId ? fn(b) : b)) }));
  const addKunde = (name) => {
    const k = { id: uid(), name };
    setDaten((d) => ({ ...d, kunden: [...d.kunden, k] }));
    return k;
  };
  const letzteBestellung = (kundeId) => {
    const frueher = [...daten.backtage].filter((b) => b.id !== backtagId).sort((a, b) => b.datum.localeCompare(a.datum));
    for (const bt of frueher) {
      const b = bt.bestellungen.find((x) => x.kundeId === kundeId);
      if (b) return b;
    }
    return null;
  };

  const uebergeben = (bz) => {
    const payload = {
      id: `bestellapp-${backtag.id}`,
      label: `Backzettel ${fmtDatum(backtag.datum)} (Bestell-App)`,
      items: bz.rohstoffe.map((r) => ({ materialId: r.materialId, needed: Math.round(r.menge * 10) / 10, name: r.mat.name })),
    };
    if (backtag.lagerUebergeben && !window.confirm("Dieser Backzettel wurde schon übergeben. Die Lager-App ersetzt dann den alten Abzug durch den neuen. Weiter?")) return;
    updateBacktag((bt) => ({ ...bt, lagerUebergeben: new Date().toISOString() }));
    const url = `${LAGER_APP_URL}#backzettel=${encodeURIComponent(JSON.stringify(payload))}`;
    // Erst wechseln, wenn gespeichert ist (spätestens nach 5 Sekunden)
    setTimeout(() => {
      Promise.race([jetztSpeichern(), new Promise((r) => setTimeout(r, 5000))]).finally(() => (window.location.href = url));
    }, 50);
  };

  const disconnect = () => {
    if (!window.confirm("Verbindung auf diesem Gerät trennen? Deine Daten bleiben online erhalten.")) return;
    localStorage.removeItem("bestellapp_config");
    window.location.reload();
  };

  const offen = backtag ? backtag.bestellungen.filter((b) => !b.bezahlt).length : 0;

  return (
    <>
    {druck && backtag && (
      <DruckAnsicht art={druck} setArt={setDruck} backtag={backtag} sorten={daten.sorten} kunden={daten.kunden} lager={lager} onClose={() => setDruck(null)} />
    )}
    <div className={`min-h-screen w-full ${druck ? "screen-only" : ""}`} style={{ backgroundColor: COL.bg, fontFamily: "'IBM Plex Sans', sans-serif", color: COL.ink }}>
      <div className="max-w-3xl mx-auto px-4 pt-4 pb-28 sm:pb-10">
        <header className="mb-4 no-print">
          <div className="relative rounded-3xl px-5 py-4" style={{ background: `radial-gradient(circle at 85% 20%, rgba(232,182,76,0.28), transparent 45%), linear-gradient(135deg, ${COL.crust} 0%, #5A3A24 100%)`, boxShadow: "0 10px 30px rgba(59,42,30,0.25)" }}>
            <div className="flex items-center justify-between gap-2">
              <Brand light small />
              <div className="flex flex-col items-end gap-1">
                <span className="text-xs px-2.5 py-1 rounded-full" style={{ backgroundColor: "rgba(255,255,255,0.1)", color: sync === "error" ? "#FFD2C2" : "rgba(255,255,255,0.75)" }} title={syncFehler}>
                  {sync === "saving" ? "speichert …" : sync === "saved" ? "✓ gespeichert" : sync === "error" ? "⚠ nicht gespeichert" : "bereit"}
                </span>
                <button onClick={() => Zugang.abmelden()} className="text-xs font-semibold px-2.5 py-1 rounded-full whitespace-nowrap" style={{ backgroundColor: "rgba(255,255,255,0.16)", color: "#fff" }} title="Abmelden">
                  👤 {Zugang.sitzung?.name} · Abmelden
                </button>
              </div>
            </div>
            <div className="mt-3 text-white text-lg" style={{ fontFamily: "'Fraunces', serif", fontWeight: 600 }}>Bestellungen 🧾</div>
            <div className="flex items-center gap-2 mt-2">
              <select
                value={backtagId || ""}
                onChange={(e) => setBacktagId(e.target.value)}
                className="flex-1"
                style={{ ...inputStyle, backgroundColor: "rgba(255,255,255,0.12)", color: "#fff", border: "1px solid rgba(255,255,255,0.25)", fontWeight: 600 }}
              >
                {!backtag && <option value="" style={{ color: COL.ink }}>– Backtag wählen –</option>}
                {backtage.map((b) => (
                  <option key={b.id} value={b.id} style={{ color: COL.ink }}>
                    🗓 {fmtDatum(b.datum)} · {b.bestellungen.length} Best.
                  </option>
                ))}
              </select>
              {chef && <button onClick={neuerBacktag} className="text-sm font-semibold px-3 py-2.5 rounded-xl whitespace-nowrap" style={{ backgroundColor: COL.wheat, color: COL.crust }}>+ Backtag</button>}
            </div>
            {neuDatum !== null && (
              <div className="flex flex-wrap items-center gap-2 mt-2 p-2 rounded-xl" style={{ backgroundColor: "rgba(255,255,255,0.1)", animation: "fadeIn .2s ease" }}>
                <span className="text-sm text-white">Neuer Backtag am</span>
                <input type="date" value={neuDatum} onChange={(e) => setNeuDatum(e.target.value)} style={{ ...inputStyle, padding: "6px 8px" }} aria-label="Datum des Backtags" />
                <button onClick={() => backtagAnlegen(neuDatum)} className="text-sm font-semibold px-3 py-2 rounded-xl" style={{ backgroundColor: COL.wheat, color: COL.crust }}>Anlegen</button>
                <button onClick={() => setNeuDatum(null)} className="text-sm px-2 py-2" style={{ color: "rgba(255,255,255,0.8)" }}>Abbrechen</button>
              </div>
            )}
          </div>
        </header>

        {sync === "error" && syncFehler && (
          <div className="text-sm px-4 py-3 rounded-2xl mb-4 no-print" style={{ backgroundColor: COL.warnSoft, color: COL.warn }}>⚠️ Speichern fehlgeschlagen: {syncFehler}</div>
        )}

        {zweitSpeicher && (
          <div className="text-sm px-4 py-3 rounded-2xl mb-4 no-print" style={{ backgroundColor: COL.amberSoft, color: COL.amber, border: `1px solid ${COL.wheat}` }}>
            <div className="font-semibold mb-1">📱💻 Es gibt noch einen zweiten Bestell-Speicher</div>
            <div className="mb-2">
              Vermutlich wurde die Bestell-App auf deinem anderen Gerät extra eingerichtet – darum sind Handy und Laptop nicht gleich.
              {zweitSpeicher.map((z) => (
                <div key={z.id} className="text-xs mt-1">
                  Speicher …{z.id.slice(-6)}: {z.kunden} Kunden, {z.bestellungen} Bestellungen{z.stand ? `, zuletzt ${fmtStand(z.stand)}` : ""}
                </div>
              ))}
            </div>
            <div className="flex flex-wrap gap-2">
              <Btn small primary onClick={zusammenfuehren}>Zusammenführen</Btn>
              <Btn small onClick={() => setZweitSpeicher(null)}>Später</Btn>
            </div>
            <div className="text-xs mt-2">Alle Kunden und Bestellungen kommen in diesen Speicher. Das andere Gerät stellt sich danach automatisch um. Nichts wird gelöscht.</div>
          </div>
        )}
        {speicherInfo && (
          <div className="flex items-start gap-2 text-sm px-4 py-3 rounded-2xl mb-4 no-print" style={{ backgroundColor: COL.okSoft, color: COL.ok }}>
            <span className="flex-1">✅ {speicherInfo}</span>
            <button onClick={() => setSpeicherInfo("")} aria-label="Schließen"><IcX size={16} /></button>
          </div>
        )}
        {abgleichInfo && (
          <div className="flex items-start gap-2 text-sm px-4 py-3 rounded-2xl mb-4 no-print" style={{ backgroundColor: COL.amberSoft, color: COL.amber }}>
            <span className="flex-1">🔄 Inzwischen wurde auf einem anderen Gerät gespeichert ({fmtStand(abgleichInfo)}). Beide Änderungen wurden zusammengeführt.</span>
            <button onClick={() => setAbgleichInfo(null)} aria-label="Schließen"><IcX size={16} /></button>
          </div>
        )}

        <nav className="hidden sm:flex gap-1 mb-4 p-1 rounded-2xl w-fit no-print" style={{ backgroundColor: COL.surface, border: `1px solid ${COL.line}` }}>
          {tabs.map((t) => {
            const I = t.icon;
            const on = tab === t.key;
            return (
              <button key={t.key} onClick={() => setTab(t.key)} className="flex items-center gap-2 px-4 py-2.5 text-sm font-medium rounded-xl" style={{ backgroundColor: on ? COL.accent : "transparent", color: on ? "#fff" : COL.inkMuted }}>
                <I size={16} /> {t.label}
              </button>
            );
          })}
        </nav>

        {tab === "einstellungen" && chef ? (
          <EinstellungenTab
            daten={daten}
            setDaten={setDaten}
            lager={lager}
            config={config}
            onReloadLager={() => ladeLager()}
            onDisconnect={disconnect}
            letzterStand={letzterStand}
            onAbgleichen={holen}
            onSpeicherPruefen={() => speicherPruefen(config, true)}
          />
        ) : !backtag ? (
          <Card>
            <div className="text-center py-8">
              <div className="text-4xl mb-2">🗓</div>
              {chef ? (
                <>
                  <p className="text-sm mb-4" style={{ color: COL.inkMuted }}>Leg zuerst einen Backtag an – dann kannst du Bestellungen eintragen.</p>
                  <Btn primary onClick={neuerBacktag}><IcPlus size={16} /> Backtag anlegen</Btn>
                </>
              ) : (
                <p className="text-sm" style={{ color: COL.inkMuted }}>Noch kein Backtag eingetragen.</p>
              )}
            </div>
          </Card>
        ) : tab === "bestellungen" ? (
          <BestellungenTab nurLesen={!chef} backtag={backtag} sorten={daten.sorten} kunden={daten.kunden} lager={lager} herstellProzent={herstellProzentVon(daten)} updateBacktag={updateBacktag} addKunde={addKunde} letzteBestellung={letzteBestellung} />
        ) : tab === "backzettel" ? (
          <BackzettelTab chef={chef} backtag={backtag} sorten={daten.sorten} lager={lager} onUebergeben={uebergeben} onReloadLager={() => ladeLager()} onDrucken={setDruck} />
        ) : tab === "expedit" || !chef ? (
          <ExpeditTab backtag={backtag} sorten={daten.sorten} kunden={daten.kunden} updateBacktag={updateBacktag} />
        ) : (
          <KassaTab backtag={backtag} sorten={daten.sorten} kunden={daten.kunden} lager={lager} herstellProzent={herstellProzentVon(daten)} updateBacktag={updateBacktag} onDrucken={setDruck} />
        )}

        <nav className="sm:hidden bottom-nav no-print fixed bottom-0 left-0 right-0 z-20 flex justify-around px-2 pt-2" style={{ backgroundColor: "rgba(255,255,255,0.95)", backdropFilter: "blur(10px)", borderTop: `1px solid ${COL.line}` }}>
          {tabs.map((t) => {
            const I = t.icon;
            const on = tab === t.key;
            return (
              <button key={t.key} onClick={() => { setTab(t.key); window.scrollTo({ top: 0 }); }} className="relative flex flex-col items-center gap-0.5 px-0.5 py-1 flex-1 min-w-0" style={{ color: on ? COL.accent : COL.inkMuted }}>
                <span className="flex items-center justify-center rounded-full" style={{ width: 44, height: 28, backgroundColor: on ? COL.accentSoft : "transparent" }}>
                  <I size={19} strokeWidth={on ? 2.4 : 2} />
                </span>
                <span className="text-[11px] w-full text-center truncate" style={{ fontWeight: on ? 600 : 500 }}>{t.mobil || t.label}</span>
                {t.key === "kassa" && offen > 0 && (
                  <span className="absolute top-0 right-1/4 text-[10px] font-bold rounded-full px-1.5" style={{ backgroundColor: COL.accent, color: "#fff" }}>{offen}</span>
                )}
              </button>
            );
          })}
        </nav>
      </div>
    </div>
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
document.getElementById("root").dataset.rendered = "1";
// Erst anmelden (Chef-Code / Mitarbeiter-Code), dann die App zeigen
Zugang.start({ app: "bestell" }).then(() => root.render(<App />));
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function () {});
    });
  }
</script>
</body>
</html>
