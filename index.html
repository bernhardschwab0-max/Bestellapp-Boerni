function KassaTab({ backtag, sorten, kunden, updateBacktag, onDrucken }) {
  const kName = (id) => kunden.find((k) => k.id === id)?.name || "(unbekannt)";
  const liste = [...(backtag.bestellungen || [])].sort((a, b) => kName(a.kundeId).localeCompare(kName(b.kundeId), "de"));
  const gesamt = liste.reduce((s, b) => s + bestellSumme(b, sorten), 0);
  const bezahlt = liste.filter((b) => b.bezahlt).reduce((s, b) => s + bestellSumme(b, sorten), 0);
  const toggle = (b) => updateBacktag((bt) => ({ ...bt, bestellungen: bt.bestellungen.map((x) => (x.id === b.id ? { ...x, bezahlt: !x.bezahlt } : x)) }));

  const waLink = (b) => {
    const zeilen = sorten.filter((s) => (b.items[s.id] || 0) > 0).map((s) => `${fmtQty(b.items[s.id])}× ${s.name} (${fmtEUR(b.items[s.id] * s.preis)})`);
    const text = `Hallo ${kName(b.kundeId).split(" ")[0]}! 🍞\nDeine Bestellung für ${fmtDatum(backtag.datum)}:\n${zeilen.join("\n")}\nGesamt: ${fmtEUR(bestellSumme(b, sorten))}\n\nLiebe Grüße, Börni's Backstube`;
    return `https://wa.me/?text=${encodeURIComponent(text)}`;
  };

  if (!liste.length) return <Card><p className="text-sm text-center py-8" style={{ color: COL.inkMuted }}>👥 Noch keine Bestellungen.</p></Card>;

  return (
    <div className="flex flex-col gap-3">
      <Card className="!p-4">
        <div className="flex items-center justify-between">
          <div>
            <div className="text-xs" style={{ color: COL.inkMuted }}>Gesamt · {liste.length} Kunden</div>
            <div className="text-2xl font-semibold" style={{ fontFamily: "'Fraunces', serif" }}>{fmtEUR(gesamt)}</div>
          </div>
          <div className="text-right text-sm">
            <div style={{ color: COL.ok }}>✅ bezahlt {fmtEUR(bezahlt)}</div>
            <div style={{ color: COL.warn }}>⏳ offen {fmtEUR(gesamt - bezahlt)}</div>
          </div>
        </div>
        <div className="h-2 rounded-full mt-3 overflow-hidden" style={{ backgroundColor: COL.warnSoft }}>
          <div className="h-full rounded-full" style={{ width: `${gesamt ? (bezahlt / gesamt) * 100 : 0}%`, backgroundColor: COL.ok, transition: "width .3s" }} />
        </div>
      </Card>

      {liste.map((b) => (
        <Card key={b.id} className="!p-3.5" style={{ opacity: b.bezahlt ? 0.7 : 1 }}>
          <div className="flex items-start justify-between gap-2">
            <div className="min-w-0">
              <div className="font-semibold">{kName(b.kundeId)}</div>
              <div className="text-sm mt-1 flex flex-col">
                {sorten.filter((s) => (b.items[s.id] || 0) > 0).map((s) => (
                  <span key={s.id}>
                    <b style={{ fontFamily: "'IBM Plex Mono', monospace" }}>{fmtQty(b.items[s.id])}×</b> {s.name}{" "}
                    <span style={{ color: COL.inkMuted }}>{Number(s.preis) > 0 ? fmtEUR(b.items[s.id] * s.preis) : "(Preis fehlt)"}</span>
                  </span>
                ))}
              </div>
              {b.notiz && <div className="text-xs mt-1 truncate" style={{ color: COL.amber, maxWidth: "100%" }}>📝 {b.notiz}</div>}
            </div>
            <div className="flex flex-col items-end gap-2">
              <div className="text-lg font-bold" style={{ fontFamily: "'IBM Plex Mono', monospace" }}>{fmtEUR(bestellSumme(b, sorten))}</div>
              <button onClick={() => toggle(b)} className="text-xs font-semibold px-2.5 py-1.5 rounded-full" style={{ backgroundColor: b.bezahlt ? COL.okSoft : COL.warnSoft, color: b.bezahlt ? COL.ok : COL.warn }}>
                {b.bezahlt ? "✅ bezahlt" : "⏳ offen"}
              </button>
              <a href={waLink(b)} target="_blank" rel="noopener" className="text-xs no-print" style={{ color: "#1F7A3A" }}>💬 per WhatsApp</a>
            </div>
          </div>
        </Card>
      ))}
      <div className="no-print flex flex-wrap gap-2">
        <Btn onClick={() => onDrucken("kundenzettel")}><IcPrint size={16} /> Kundenzettel drucken</Btn>
        <Btn onClick={() => onDrucken("lieferliste")}><IcPrint size={16} /> Lieferliste drucken</Btn>
      </div>
    </div>
  );
}

// ---------- Einstellungen ----------
function EinstellungenTab({ daten, setDaten, lager, config, onReloadLager, onDisconnect }) {
  const [bereich, setBereich] = useState("sorten");
  const [neueKunden, setNeueKunden] = useState("");
  const [zeigeLink, setZeigeLink] = useState(false);
  const rezepte = [...(lager?.recipes || [])].sort((a, b) => a.name.localeCompare(b.name, "de"));
  const setSorten = (fn) => setDaten((d) => ({ ...d, sorten: fn(d.sorten) }));
  const upd = (id, patch) => setSorten((ss) => ss.map((s) => (s.id === id ? { ...s, ...patch } : s)));
  const move = (idx, dir) =>
    setSorten((ss) => {
      const n = [...ss];
      const j = idx + dir;
      if (j < 0 || j >= n.length) return n;
      [n[idx], n[j]] = [n[j], n[idx]];
      return n;
    });

  const kundenHinzu = () => {
    const namen = neueKunden.split(/\n/).map((x) => x.trim()).filter(Boolean);
    setDaten((d) => {
      const vorhanden = new Set(d.kunden.map((k) => k.name.trim().toLowerCase()));
      const neu = namen.filter((n) => !vorhanden.has(n.toLowerCase())).map((name) => ({ id: uid(), name }));
      return { ...d, kunden: [...d.kunden, ...neu] };
    });
    setNeueKunden("");
  };
  const benutzteKunden = new Set(daten.backtage.flatMap((bt) => bt.bestellungen.map((b) => b.kundeId)));
  const groesse = new Blob([JSON.stringify(daten)]).size;

  return (
    <div className="flex flex-col gap-4">
      <div className="flex gap-1 p-1 rounded-xl" style={{ backgroundColor: COL.surface, border: `1px solid ${COL.line}` }}>
        {[["sorten", "🥖 Sorten"], ["kunden", "👥 Kunden"], ["app", "⚙️ App"]].map(([k, l]) => (
          <button key={k} onClick={() => setBereich(k)} className="flex-1 text-sm py-2 rounded-lg" style={{ backgroundColor: bereich === k ? COL.accent : "transparent", color: bereich === k ? "#fff" : COL.ink }}>{l}</button>
        ))}
      </div>

      {bereich === "sorten" && (
        <>
          <p className="text-sm" style={{ color: COL.inkMuted }}>
            Für jede Sorte: welches Rezept aus der Lager-App, wie schwer ein Stück ist (leer = aus dem Rezept) und der Verkaufspreis. „Extra“ ist z.B. eine Füllung oder ein Topping mit eigenem Rezept.
          </p>
          {daten.sorten.map((s, idx) => {
            const rez = findRezept(lager?.recipes || [], s.rezept);
            const auto = rez ? gProStueck({ gProStueck: "" }, rez) : 0;
            return (
              <Card key={s.id} className="!p-3.5" style={{ opacity: s.aktiv ? 1 : 0.6 }}>
                <div className="flex items-center gap-2 mb-2">
                  <input style={{ ...inputStyle, width: 90, fontWeight: 600 }} value={s.kurz} onChange={(e) => upd(s.id, { kurz: e.target.value })} aria-label="Kürzel" />
                  <input style={{ ...inputStyle, flex: 1 }} value={s.name} onChange={(e) => upd(s.id, { name: e.target.value })} aria-label="Name" />
                  <div className="flex flex-col">
                    <button onClick={() => move(idx, -1)} className="text-xs px-1" style={{ color: COL.inkMuted }} aria-label="nach oben">▲</button>
                    <button onClick={() => move(idx, 1)} className="text-xs px-1" style={{ color: COL.inkMuted }} aria-label="nach unten">▼</button>
                  </div>
                </div>
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                  <div className="col-span-2">
                    <Field label="Rezept">
                      <select style={{ ...inputStyle, borderColor: rez ? COL.line : COL.warn }} value={rez ? rez.name : ""} onChange={(e) => upd(s.id, { rezept: e.target.value })}>
                        <option value="">– bitte wählen –</option>
                        {rezepte.map((r) => <option key={r.id} value={r.name}>{r.name}</option>)}
                      </select>
                    </Field>
                  </div>
                  <Field label="g pro Stück">
                    <input style={inputStyle} inputMode="decimal" value={s.gProStueck ?? ""} onChange={(e) => upd(s.id, { gProStueck: e.target.value })} placeholder={auto ? `${Math.round(auto)} (Rezept)` : "z.B. 100"} />
                  </Field>
                  <Field label="Preis €">
                    <input style={{ ...inputStyle, borderColor: Number(s.preis) > 0 ? COL.line : COL.amber }} inputMode="decimal" value={s.preis ?? ""} onChange={(e) => upd(s.id, { preis: e.target.value.replace(",", ".") })} />
                  </Field>
                </div>
                {(s.extras || []).map((x, xi) => {
                  // Wert im Auswahlfeld: "r:Rezeptname" oder "m:Rohstoffname"
                  const xRez = x.rezept ? findRezept(lager?.recipes || [], x.rezept) : null;
                  const xMat = x.rohstoff ? findRohstoff(lager?.materials || [], x.rohstoff) : null;
                  const wert = xRez ? `r:${xRez.name}` : xMat ? `m:${xMat.name}` : "";
                  const xAuto = xRez ? gProStueck({ gProStueck: "" }, xRez) : 0;
                  const setzen = (v) => {
                    const neu = v.startsWith("r:") ? { rezept: v.slice(2), rohstoff: "" } : v.startsWith("m:") ? { rohstoff: v.slice(2), rezept: "" } : { rezept: "", rohstoff: "" };
                    upd(s.id, { extras: s.extras.map((y, yi) => (yi === xi ? { ...y, ...neu } : y)) });
                  };
                  return (
                  <div key={xi} className="flex items-end gap-2 mt-2">
                    <div className="flex-1">
                      <Field label="Extra: Füllung/Topping (Rezept) oder Zugabe (Rohstoff)">
                        <select style={{ ...inputStyle, borderColor: wert ? COL.line : COL.warn }} value={wert} onChange={(e) => setzen(e.target.value)}>
                          <option value="">– wählen –</option>
                          <optgroup label="Rezepte">
                            {rezepte.map((r) => <option key={r.id} value={`r:${r.name}`}>{r.name}</option>)}
                          </optgroup>
                          <optgroup label="Rohstoffe (Zugabe)">
                            {[...(lager?.materials || [])].filter((m) => !m.vorteig).sort((a, b) => a.name.localeCompare(b.name, "de")).map((m) => <option key={m.id} value={`m:${m.name}`}>{m.name}</option>)}
                          </optgroup>
                        </select>
                      </Field>
                    </div>
                    <div style={{ width: 90 }}>
                      <Field label="g/Stück">
                        <input style={inputStyle} inputMode="decimal" value={x.g ?? ""} placeholder={xAuto ? `${fmtNum(xAuto)} (Rezept)` : ""} onChange={(e) => upd(s.id, { extras: s.extras.map((y, yi) => (yi === xi ? { ...y, g: e.target.value } : y)) })} />
                      </Field>
                    </div>
                    <button className="pb-3" style={{ color: COL.warn }} onClick={() => upd(s.id, { extras: s.extras.filter((_, yi) => yi !== xi) })} aria-label="Extra entfernen"><IcX size={16} /></button>
                  </div>
                  );
                })}
                <div className="flex flex-wrap items-center gap-x-4 gap-y-2 mt-3 text-sm">
                  <label className="flex items-center gap-1.5"><input type="checkbox" checked={s.aktiv} onChange={(e) => upd(s.id, { aktiv: e.target.checked })} /> aktiv</label>
                  <label className="flex items-center gap-1.5"><input type="checkbox" checked={!!s.halbe} onChange={(e) => upd(s.id, { halbe: e.target.checked })} /> halbe möglich</label>
                  <button style={{ color: COL.accent }} onClick={() => upd(s.id, { extras: [...(s.extras || []), { rezept: "", g: "" }] })}>+ Extra</button>
                  <button style={{ color: COL.warn }} className="ml-auto" onClick={() => window.confirm(`Sorte „${s.kurz}“ löschen?`) && setSorten((ss) => ss.filter((x) => x.id !== s.id))}>Löschen</button>
                </div>
                <div className="mt-2">
                  <Field label="Andere Schreibweisen für WhatsApp (mit Komma)">
                    <input style={{ ...inputStyle, fontSize: 13 }} value={s.aliases || ""} onChange={(e) => upd(s.id, { aliases: e.target.value })} />
                  </Field>
                </div>
              </Card>
            );
          })}
          <Btn onClick={() => setSorten((ss) => [...ss, { id: uid(), kurz: "Neu", name: "Neue Sorte", rezept: "", gProStueck: "", preis: 0, extras: [], aktiv: true, halbe: false, aliases: "" }])}>
            <IcPlus size={16} /> Neue Sorte
          </Btn>
        </>
      )}

      {bereich === "kunden" && (
        <>
          <Card>
            <H2>Kunden hinzufügen</H2>
            <textarea style={{ ...inputStyle, width: "100%", minHeight: 90 }} value={neueKunden} onChange={(e) => setNeueKunden(e.target.value)} placeholder={"Ein Name pro Zeile – du kannst auch deine ganze Liste aus Excel hineinkopieren."} />
            <div className="mt-2"><Btn primary onClick={kundenHinzu} disabled={!neueKunden.trim()}>Hinzufügen</Btn></div>
          </Card>
          <Card>
            <H2>{daten.kunden.length} Kunden</H2>
            <div className="flex flex-col">
              {[...daten.kunden].sort((a, b) => a.name.localeCompare(b.name, "de")).map((k, i) => (
                <div key={k.id} className="flex items-center gap-2 py-1.5" style={{ borderTop: i ? `1px solid ${COL.line}` : "none" }}>
                  <input style={{ ...inputStyle, flex: 1, padding: "6px 9px", fontSize: 14 }} value={k.name} onChange={(e) => setDaten((d) => ({ ...d, kunden: d.kunden.map((x) => (x.id === k.id ? { ...x, name: e.target.value } : x)) }))} />
                  <button
                    style={{ color: benutzteKunden.has(k.id) ? COL.line : COL.warn }}
                    disabled={benutzteKunden.has(k.id)}
                    title={benutzteKunden.has(k.id) ? "Hat Bestellungen – kann nicht gelöscht werden" : "Löschen"}
                    onClick={() => window.confirm(`${k.name} löschen?`) && setDaten((d) => ({ ...d, kunden: d.kunden.filter((x) => x.id !== k.id) }))}
                  >
                    <IcTrash size={15} />
                  </button>
                </div>
              ))}
            </div>
          </Card>
        </>
      )}

      {bereich === "app" && (
        <Card>
          <div className="flex flex-col gap-3 text-sm">
            <div>📖 Aus der Lager-App geladen: <b>{lager?.recipes?.length || 0} Rezepte</b>, <b>{lager?.materials?.length || 0} Rohstoffe</b></div>
            <Btn onClick={onReloadLager}>🔄 Rezepte & Lagerstand neu laden</Btn>
            <div>💾 Speicher belegt: <b>{fmtNum(groesse / 1024)} kb</b> von 100 kb (die letzten {MAX_BACKTAGE} Backtage werden aufgehoben)</div>
            <Btn onClick={() => setZeigeLink(!zeigeLink)}>📱 Neues Gerät einrichten</Btn>
            {zeigeLink && (
              <div className="flex flex-col items-center gap-2">
                <QrCode text={makeSetupUrl(config)} size={220} />
                <input readOnly value={makeSetupUrl(config)} onFocus={(e) => e.target.select()} style={{ ...inputStyle, width: "100%", fontSize: 11, fontFamily: "'IBM Plex Mono', monospace" }} />
                <p className="text-xs text-center" style={{ color: COL.warn }}>Achtung: Wer diesen Link hat, kann auf deine Daten zugreifen – nur mit eigenen Geräten teilen.</p>
              </div>
            )}
            <a href={LAGER_APP_URL} className="underline" style={{ color: COL.accent }}>→ Zur Lager-App</a>
            <Btn danger onClick={onDisconnect}>Verbindung auf diesem Gerät trennen</Btn>
          </div>
        </Card>
      )}
    </div>
  );
}

// ---------- Haupt-App ----------
const TABS = [
  { key: "bestellungen", label: "Bestellungen", icon: IcList },
  { key: "backzettel", label: "Backzettel", icon: IcBread },
  { key: "kassa", label: "Kunden & €", icon: IcUsers },
  { key: "einstellungen", label: "Einstellungen", icon: IcGear },
];

function App() {
  const [config, setConfig] = useState(() => getConfig());
  const [daten, setDaten] = useState(leereDaten);
  const [lager, setLager] = useState(null);
  const [loading, setLoading] = useState(true);
  const [tab, setTab] = useState("bestellungen");
  const [backtagId, setBacktagId] = useState(null);
  const [sync, setSync] = useState("idle");
  const [syncFehler, setSyncFehler] = useState("");
  const [neuDatum, setNeuDatum] = useState(null); // offenes Datumsfeld für neuen Backtag
  const [druck, setDruck] = useState(null); // "backzettel" | "kundenzettel" | "lieferliste"
  const loadedRef = useRef(false);
  const dirtyRef = useRef(false);
  const skipSaveRef = useRef(false);

  const ladeLager = async (c = config) => {
    try {
      const rec = await binRead(c.apiKey, c.lagerBin);
      setLager({ recipes: rec.recipes || [], materials: rec.materials || [] });
    } catch (e) {
      setLager(null);
    }
  };
  const ladeDaten = async (c = config) => {
    const rec = await binRead(c.apiKey, c.bestellBin);
    const d = { ...leereDaten(), ...rec, sortenUpdates: rec.sortenUpdates || [] };
    if (!rec.sorten?.length) return { ...d, sorten: STANDARD_SORTEN, sortenUpdates: SORTEN_UPDATES.map((u) => u.id) };
    return sortenAktualisieren(d);
  };

  useEffect(() => {
    if (!config) { setLoading(false); return; }
    (async () => {
      try {
        const [d] = await Promise.all([ladeDaten(), ladeLager()]);
        setDaten(d);
        const kommend = [...d.backtage].sort((a, b) => a.datum.localeCompare(b.datum)).find((b) => b.datum >= isoHeute());
        setBacktagId((kommend || d.backtage[d.backtage.length - 1])?.id || null);
      } catch (e) {
        setSync("error");
        setSyncFehler(e.message);
      } finally {
        loadedRef.current = true;
        setLoading(false);
      }
    })();
  }, [config]);

  // Automatisch speichern
  useEffect(() => {
    if (!config || !loadedRef.current) return;
    if (skipSaveRef.current) {
      skipSaveRef.current = false;
      return;
    }
    dirtyRef.current = true;
    setSync("saving");
    const t = setTimeout(async () => {
      try {
        const sortiert = [...daten.backtage].sort((a, b) => b.datum.localeCompare(a.datum)).slice(0, MAX_BACKTAGE);
        await binWrite(config.apiKey, config.bestellBin, { ...daten, backtage: sortiert });
        dirtyRef.current = false;
        setSync("saved");
        setSyncFehler("");
      } catch (e) {
        setSync("error");
        setSyncFehler(e.message);
      }
    }, 900);
    return () => clearTimeout(t);
  }, [daten]);

  // Beim Zurückkehren in die App: Änderungen vom anderen Gerät holen (nur wenn hier nichts ungespeichert ist)
  useEffect(() => {
    const onVis = async () => {
      if (document.visibilityState !== "visible" || !config || dirtyRef.current || !loadedRef.current) return;
      try {
        const d = await ladeDaten();
        skipSaveRef.current = true;
        setDaten(d);
        ladeLager();
      } catch (e) {}
    };
    document.addEventListener("visibilitychange", onVis);
    return () => document.removeEventListener("visibilitychange", onVis);
  }, [config]);

  if (!config) return <SetupScreen onReady={() => setConfig(getConfig())} />;
  if (loading) {
    return (
      <div className="min-h-screen flex flex-col items-center justify-center gap-4" style={{ backgroundColor: COL.bg, fontFamily: "'IBM Plex Sans', sans-serif", color: COL.inkMuted }}>
        <div style={{ fontSize: 56, animation: "rise 1.6s ease-in-out infinite" }}>🧾</div>
        <Brand small />
        <div className="text-sm">Bestellungen werden geholt …</div>
      </div>
    );
  }

  const backtage = [...daten.backtage].sort((a, b) => a.datum.localeCompare(b.datum));
  const backtag = daten.backtage.find((b) => b.id === backtagId) || null;

  const neuerBacktag = () => {
    const letzter = backtage[backtage.length - 1];
    const vorschlag = letzter && letzter.datum >= isoHeute() ? plusTage(letzter.datum, 7) : isoHeute();
    setNeuDatum(vorschlag);
  };
  const backtagAnlegen = (datum) => {
    setNeuDatum(null);
    if (!datum || !/^\d{4}-\d{2}-\d{2}$/.test(datum)) return;
    const vorhanden = daten.backtage.find((b) => b.datum === datum);
    if (vorhanden) { setBacktagId(vorhanden.id); return; }
    const bt = { id: uid(), datum, bestellungen: [], lagerUebergeben: null };
    setDaten((d) => ({ ...d, backtage: [...d.backtage, bt] }));
    setBacktagId(bt.id);
    setTab("bestellungen");
  };
  const updateBacktag = (fn) => setDaten((d) => ({ ...d, backtage: d.backtage.map((b) => (b.id === backtagId ? fn(b) : b)) }));
  const addKunde = (name) => {
    const k = { id: uid(), name };
    setDaten((d) => ({ ...d, kunden: [...d.kunden, k] }));
    return k;
  };
  const letzteBestellung = (kundeId) => {
    const frueher = [...daten.backtage].filter((b) => b.id !== backtagId).sort((a, b) => b.datum.localeCompare(a.datum));
    for (const bt of frueher) {
      const b = bt.bestellungen.find((x) => x.kundeId === kundeId);
      if (b) return b;
    }
    return null;
  };

  const uebergeben = (bz) => {
    const payload = {
      id: `bestellapp-${backtag.id}`,
      label: `Backzettel ${fmtDatum(backtag.datum)} (Bestell-App)`,
      items: bz.rohstoffe.map((r) => ({ materialId: r.materialId, needed: Math.round(r.menge * 10) / 10, name: r.mat.name })),
    };
    if (backtag.lagerUebergeben && !window.confirm("Dieser Backzettel wurde schon übergeben. Die Lager-App ersetzt dann den alten Abzug durch den neuen. Weiter?")) return;
    updateBacktag((bt) => ({ ...bt, lagerUebergeben: new Date().toISOString() }));
    const url = `${LAGER_APP_URL}#backzettel=${encodeURIComponent(JSON.stringify(payload))}`;
    setTimeout(() => (window.location.href = url), 1200); // kurz warten, damit gespeichert wird
  };

  const disconnect = () => {
    if (!window.confirm("Verbindung auf diesem Gerät trennen? Deine Daten bleiben online erhalten.")) return;
    localStorage.removeItem("bestellapp_config");
    window.location.reload();
  };

  const offen = backtag ? backtag.bestellungen.filter((b) => !b.bezahlt).length : 0;

  return (
    <>
    {druck && backtag && (
      <DruckAnsicht art={druck} setArt={setDruck} backtag={backtag} sorten={daten.sorten} kunden={daten.kunden} lager={lager} onClose={() => setDruck(null)} />
    )}
    <div className={`min-h-screen w-full ${druck ? "screen-only" : ""}`} style={{ backgroundColor: COL.bg, fontFamily: "'IBM Plex Sans', sans-serif", color: COL.ink }}>
      <div className="max-w-3xl mx-auto px-4 pt-4 pb-28 sm:pb-10">
        <header className="mb-4 no-print">
          <div className="relative rounded-3xl px-5 py-4" style={{ background: `radial-gradient(circle at 85% 20%, rgba(232,182,76,0.28), transparent 45%), linear-gradient(135deg, ${COL.crust} 0%, #5A3A24 100%)`, boxShadow: "0 10px 30px rgba(59,42,30,0.25)" }}>
            <div className="flex items-center justify-between gap-2">
              <Brand light small />
              <span className="text-xs px-2.5 py-1 rounded-full" style={{ backgroundColor: "rgba(255,255,255,0.1)", color: sync === "error" ? "#FFD2C2" : "rgba(255,255,255,0.75)" }} title={syncFehler}>
                {sync === "saving" ? "speichert …" : sync === "saved" ? "✓ gespeichert" : sync === "error" ? "⚠ nicht gespeichert" : "bereit"}
              </span>
            </div>
            <div className="mt-3 text-white text-lg" style={{ fontFamily: "'Fraunces', serif", fontWeight: 600 }}>Bestellungen 🧾</div>
            <div className="flex items-center gap-2 mt-2">
              <select
                value={backtagId || ""}
                onChange={(e) => setBacktagId(e.target.value)}
                className="flex-1"
                style={{ ...inputStyle, backgroundColor: "rgba(255,255,255,0.12)", color: "#fff", border: "1px solid rgba(255,255,255,0.25)", fontWeight: 600 }}
              >
                {!backtag && <option value="" style={{ color: COL.ink }}>– Backtag wählen –</option>}
                {backtage.map((b) => (
                  <option key={b.id} value={b.id} style={{ color: COL.ink }}>
                    🗓 {fmtDatum(b.datum)} · {b.bestellungen.length} Best.
                  </option>
                ))}
              </select>
              <button onClick={neuerBacktag} className="text-sm font-semibold px-3 py-2.5 rounded-xl whitespace-nowrap" style={{ backgroundColor: COL.wheat, color: COL.crust }}>+ Backtag</button>
            </div>
            {neuDatum !== null && (
              <div className="flex flex-wrap items-center gap-2 mt-2 p-2 rounded-xl" style={{ backgroundColor: "rgba(255,255,255,0.1)", animation: "fadeIn .2s ease" }}>
                <span className="text-sm text-white">Neuer Backtag am</span>
                <input type="date" value={neuDatum} onChange={(e) => setNeuDatum(e.target.value)} style={{ ...inputStyle, padding: "6px 8px" }} aria-label="Datum des Backtags" />
                <button onClick={() => backtagAnlegen(neuDatum)} className="text-sm font-semibold px-3 py-2 rounded-xl" style={{ backgroundColor: COL.wheat, color: COL.crust }}>Anlegen</button>
                <button onClick={() => setNeuDatum(null)} className="text-sm px-2 py-2" style={{ color: "rgba(255,255,255,0.8)" }}>Abbrechen</button>
              </div>
            )}
          </div>
        </header>

        {sync === "error" && syncFehler && (
          <div className="text-sm px-4 py-3 rounded-2xl mb-4 no-print" style={{ backgroundColor: COL.warnSoft, color: COL.warn }}>⚠️ Speichern fehlgeschlagen: {syncFehler}</div>
        )}

        <nav className="hidden sm:flex gap-1 mb-4 p-1 rounded-2xl w-fit no-print" style={{ backgroundColor: COL.surface, border: `1px solid ${COL.line}` }}>
          {TABS.map((t) => {
            const I = t.icon;
            const on = tab === t.key;
            return (
              <button key={t.key} onClick={() => setTab(t.key)} className="flex items-center gap-2 px-4 py-2.5 text-sm font-medium rounded-xl" style={{ backgroundColor: on ? COL.accent : "transparent", color: on ? "#fff" : COL.inkMuted }}>
                <I size={16} /> {t.label}
              </button>
            );
          })}
        </nav>

        {tab === "einstellungen" ? (
          <EinstellungenTab daten={daten} setDaten={setDaten} lager={lager} config={config} onReloadLager={() => ladeLager()} onDisconnect={disconnect} />
        ) : !backtag ? (
          <Card>
            <div className="text-center py-8">
              <div className="text-4xl mb-2">🗓</div>
              <p className="text-sm mb-4" style={{ color: COL.inkMuted }}>Leg zuerst einen Backtag an – dann kannst du Bestellungen eintragen.</p>
              <Btn primary onClick={neuerBacktag}><IcPlus size={16} /> Backtag anlegen</Btn>
            </div>
          </Card>
        ) : tab === "bestellungen" ? (
          <BestellungenTab backtag={backtag} sorten={daten.sorten} kunden={daten.kunden} updateBacktag={updateBacktag} addKunde={addKunde} letzteBestellung={letzteBestellung} />
        ) : tab === "backzettel" ? (
          <BackzettelTab backtag={backtag} sorten={daten.sorten} lager={lager} onUebergeben={uebergeben} onReloadLager={() => ladeLager()} onDrucken={setDruck} />
        ) : (
          <KassaTab backtag={backtag} sorten={daten.sorten} kunden={daten.kunden} updateBacktag={updateBacktag} onDrucken={setDruck} />
        )}

        <nav className="sm:hidden bottom-nav no-print fixed bottom-0 left-0 right-0 z-20 flex justify-around px-2 pt-2" style={{ backgroundColor: "rgba(255,255,255,0.95)", backdropFilter: "blur(10px)", borderTop: `1px solid ${COL.line}` }}>
          {TABS.map((t) => {
            const I = t.icon;
            const on = tab === t.key;
            return (
              <button key={t.key} onClick={() => { setTab(t.key); window.scrollTo({ top: 0 }); }} className="relative flex flex-col items-center gap-0.5 px-0.5 py-1 flex-1 min-w-0" style={{ color: on ? COL.accent : COL.inkMuted }}>
                <span className="flex items-center justify-center rounded-full" style={{ width: 44, height: 28, backgroundColor: on ? COL.accentSoft : "transparent" }}>
                  <I size={19} strokeWidth={on ? 2.4 : 2} />
                </span>
                <span className="text-[11px]" style={{ fontWeight: on ? 600 : 500 }}>{t.label}</span>
                {t.key === "kassa" && offen > 0 && (
                  <span className="absolute top-0 right-1/4 text-[10px] font-bold rounded-full px-1.5" style={{ backgroundColor: COL.accent, color: "#fff" }}>{offen}</span>
                )}
              </button>
            );
          })}
        </nav>
      </div>
    </div>
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
document.getElementById("root").dataset.rendered = "1";
root.render(<App />);
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function () {});
    });
  }
</script>
</body>
</html>
